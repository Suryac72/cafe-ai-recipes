spring:
  application:
    name: cafe-ai-recipes
  datasource:
    url: "jdbc:postgresql://ep-winter-dust-apf97y4s-pooler.c-7.us-east-1.aws.neon.tech/receipedb?sslmode=require&channelBinding=require"
    username: ${NEON_USERNAME}
    password: ${NEON_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

grok:
  api:
    key: ${GROQ_API_KEY}
    url: "https://api.groq.com/openai/v1/chat/completions"

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

google:
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_CLIENT_SECRET}

server:
  port: 8080

logging:
  level:
    com.cafe.ai: DEBUG




